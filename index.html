<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FH PA Dashboard</title>
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  </head>
  <body>
    <div id='errors'></div>
    
    <div id="loading" class="loading-container">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading patient data...</p>
      </div>
    </div>
    
    <div id='holder' class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-content">
                 <div class="app-title">
                   <i class="fas fa-heartbeat"></i>
                   <h1>FH PA Dashboard</h1>
                 </div>
          <div class="patient-badge">
            <i class="fas fa-user"></i>
            <span id="patient-name-display">Patient</span>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Patient Demographics Card -->
        <section class="card patient-card">
          <div class="card-header">
            <i class="fas fa-user-circle"></i>
            <h2>Patient Demographics</h2>
          </div>
          <div class="card-content">
            <div class="info-grid">
              <div class="info-item">
                <label>First Name</label>
                <span id='fname' class="value">-</span>
              </div>
              <div class="info-item">
                <label>Last Name</label>
                <span id='lname' class="value">-</span>
              </div>
              <div class="info-item">
                <label>Gender</label>
                <span id='gender' class="value">-</span>
              </div>
              <div class="info-item">
                <label>Date of Birth</label>
                <span id='birthdate' class="value">-</span>
              </div>
            </div>
          </div>
        </section>

               <!-- Vitals Card -->
               <section class="card vitals-card">
                 <div class="card-header">
                   <i class="fas fa-heartbeat"></i>
                   <h2>Vitals & Observations</h2>
                 </div>
                 <div class="card-content">
                   <div id='vitals' class="loading-state">
                     <i class="fas fa-spinner fa-spin"></i>
                     <span>Loading vitals...</span>
                   </div>
                 </div>
               </section>

        <!-- Medications Card -->
        <section class="card medications-card">
          <div class="card-header">
            <i class="fas fa-pills"></i>
            <h2>Medications</h2>
          </div>
          <div class="card-content">
            <div id='medications' class="loading-state">
              <i class="fas fa-spinner fa-spin"></i>
              <span>Loading medications...</span>
            </div>
          </div>
        </section>

        <!-- Allergies Card -->
        <section class="card allergies-card">
          <div class="card-header">
            <i class="fas fa-exclamation-triangle"></i>
            <h2>Allergies</h2>
          </div>
          <div class="card-content">
            <div id='allergies' class="loading-state">
              <i class="fas fa-spinner fa-spin"></i>
              <span>Loading allergies...</span>
            </div>
          </div>
        </section>

        <!-- Conditions Card -->
        <section class="card conditions-card">
          <div class="card-header">
            <i class="fas fa-stethoscope"></i>
            <h2>Conditions</h2>
          </div>
          <div class="card-content">
            <div id='conditions' class="loading-state">
              <i class="fas fa-spinner fa-spin"></i>
              <span>Loading conditions...</span>
            </div>
          </div>
        </section>

        <!-- Documents Card -->
        <section class="card documents-card">
          <div class="card-header">
            <i class="fas fa-file-medical"></i>
            <h2>Clinical Documents</h2>
          </div>
          <div class="card-content">
            <div id='documents' class="loading-state">
              <i class="fas fa-spinner fa-spin"></i>
              <span>Loading documents...</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

    <!-- Application-level javascript-->
    <script src='./src/js/example-smart-app.js?v=5.1'></script>

    <!-- FHIR Client JS Library -->
    <script src='https://unpkg.com/fhirclient@2.4.0/build/fhir-client.js?v=2.4.0'></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>
      extractData().then(
        //Display Patient Demographics and Observations if extractData was success
        function(p) {
          drawVisualization(p);
        },

        //Display 'Failed to call FHIR Service' if extractData failed
        function() {
          $('#loading').hide();
          $('#errors').html('<p> Failed to call FHIR Service </p>');
        }
      );
    </script>
  </body>
</html>
