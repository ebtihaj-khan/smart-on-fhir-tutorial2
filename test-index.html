<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Test SMART App - Results</title>
  </head>
  <body>
    <h1>SMART App Test Results</h1>
    <div id="status">Processing...</div>
    <div id="patient-info"></div>
    <div id="error-info"></div>
    
    <script src='./lib/js/fhir-client-v0.1.12.js'></script>
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script>
      function onError(error) {
        console.error('Error:', error);
        document.getElementById('status').innerHTML = 'Error occurred';
        document.getElementById('error-info').innerHTML = '<pre>' + JSON.stringify(error, null, 2) + '</pre>';
      }

      function onReady(smart) {
        console.log('SMART ready:', smart);
        document.getElementById('status').innerHTML = 'SMART client ready';
        
        if (smart.hasOwnProperty('patient')) {
          document.getElementById('patient-info').innerHTML = '<h3>Patient Context Found</h3><pre>' + JSON.stringify(smart.patient, null, 2) + '</pre>';
        } else {
          document.getElementById('patient-info').innerHTML = '<h3>No Patient Context</h3>';
        }
      }

      FHIR.oauth2.ready(onReady, onError);
    </script>
  </body>
</html>
