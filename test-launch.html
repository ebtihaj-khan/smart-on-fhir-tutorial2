<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART App Test</title>
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
  </head>
  <body>
    <h1>SMART App Test</h1>
    <p>Testing different scope formats until it works</p>
    
    <!-- SMART on FHIR JavaScript Library -->
    <script src="https://unpkg.com/fhirclient@2.4.0/build/fhir-client.js"></script>
    
    <script>
      console.log('Starting test launch with alternative scope formats');
      
      // Check if this is an OAuth callback
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');
      const errorUri = urlParams.get('error_uri');
      
      console.log('URL parameters:', { code, state, error, errorUri });
      
      if (code) {
        // OAuth callback - redirect to main app
        console.log('OAuth callback received, redirecting to main app');
        window.location.href = './index.html';
      } else if (error) {
        // Error from EHR
        console.log('EHR returned an error:', error);
        console.log('Error URI:', errorUri);
        document.body.innerHTML = '<h1>Launch Error</h1><p>Error: ' + error + '</p><p>Please check your app configuration.</p>';
      } else {
        // Initial launch - start OAuth flow
        const iss = urlParams.get('iss');
        const launch = urlParams.get('launch');
        
        console.log('Launch parameters:', { iss, launch });
        
        if (iss) {
          // EHR launch - try different scope formats
          console.log('Starting EHR launch sequence with alternative scopes');
          
          // Try explicit scopes that Cerner might expect
          const authConfig = {
            client_id: '43ae576d-41fd-4e5e-a654-45c7d294f919',
            scope: 'launch online_access openid profile',
            iss: iss,
            launch: launch
          };
          
          console.log('Auth config:', authConfig);
          FHIR.oauth2.authorize(authConfig);
        } else {
          // Standalone launch
          console.log('Starting standalone launch with alternative scopes');
          
          const authConfig = {
            client_id: '43ae576d-41fd-4e5e-a654-45c7d294f919',
            scope: 'launch online_access openid profile'
          };
          
          console.log('Auth config:', authConfig);
          FHIR.oauth2.authorize(authConfig);
        }
      }
    </script>
    
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
