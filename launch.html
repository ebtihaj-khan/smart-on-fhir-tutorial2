<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
    <title>ebtihaj-khan-SMART-App</title>
  </head>
  <body>
    <!-- Required JS files to enable this page to embed within an MPage -->
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

    <!-- FHIR Client JS Library -->
    <script src='https://unpkg.com/fhirclient@2.4.0/build/fhir-client.js?v=2.4.0'></script>
    
    <!-- Add Oracle Health specific configuration -->
    <script>
        // Configure FHIR client for Oracle Health
        if (window.FHIR) {
            // Set default configuration for Oracle Health
            window.FHIR.oauth2.settings = {
                replaceBrowserHistory: true,
                completeInTarget: true
            };
        }
    </script>
    <script>
        // Localhost-only configuration
        const config = {
            clientId: '3e0b9045-0ea9-432a-848f-cccfed325142',
            applicationId: 'ccfeb89f-1051-42c9-b53e-f9a411b69863',
            redirectUri: 'http://localhost:443/index.html'
        };
        
        console.log('Using Client ID:', config.clientId);
        console.log('Using Application ID:', config.applicationId);
        console.log('Using Redirect URI:', config.redirectUri);
        
        // Check if this is an OAuth callback (has code parameter)
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorUri = urlParams.get('error_uri');
        
        console.log('Launch parameters:', { code, state, error, errorUri });
        console.log('Full URL:', window.location.href);
        console.log('All URL parameters:', Object.fromEntries(urlParams.entries()));
        console.log('Referrer:', document.referrer);
        
        if (code) {
            // This is an OAuth callback - redirect to the main app
            console.log('OAuth callback received, redirecting to main app');
            // Preserve the OAuth parameters for the main app
            window.location.href = './index.html' + window.location.search;
        } else if (error) {
            // There's an error from the EHR
            console.log('EHR returned an error:', error);
            console.log('Error URI:', errorUri);
            document.body.innerHTML = '<h1>Launch Error</h1><p>Error: ' + error + '</p><p>Please check your app configuration.</p>';
        } else {
            // This is an initial launch - start OAuth flow
            const iss = urlParams.get('iss');
            const launch = urlParams.get('launch');
            
            console.log('Launch parameters:', { iss, launch });
            console.log('Current URL:', window.location.href);
            console.log('All search params:', Object.fromEntries(urlParams.entries()));
            
            if (iss) {
                // Launch with iss parameter (from EHR) - use the proper launch sequence
                console.log('Starting EHR launch sequence');
                console.log('ISS:', iss);
                console.log('Launch:', launch);
                
                const authConfig = {
                    'client_id': config.clientId,
                    'scope': 'launch online_access openid profile fhirUser patient/Patient.read patient/Observation.read patient/MedicationRequest.read patient/AllergyIntolerance.read patient/Condition.read patient/DocumentReference.read patient/Encounter.read patient/Encounter.write user/Encounter.write',
                    'redirect_uri': config.redirectUri,
                    'response_type': 'code',
                    'iss': iss,
                    'aud': iss,  // important for Cerner - set aud equal to iss
                    'launch': launch
                };
                console.log('Auth config:', authConfig);
                FHIR.oauth2.authorize(authConfig);
            } else {
                // Launch without iss parameter (standalone)
                console.log('Starting standalone launch');
                console.log('No launch parameters found, redirecting to SMART Health IT sandbox for testing');
                window.location.href = 'https://launch.smarthealthit.org/v/r4/fhir';
            }
        }
    </script>
    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
